timeout = 3

[[profile]]
name = "laptop"
exec = [
  "notify-send shikane \"Profile $SHIKANE_PROFILE_NAME has been applied\""
]

[[profile.output]]
enable = true
search = ["m=0x403D", "s=", "v=Lenovo Group Limited"]
mode = "1920x1200@60.026Hz"
position = "0,0"
scale = 1.0
transform = "normal"
adaptive_sync = false
exec = [
  "sleep 5",
  "swayws range --numeric 1 10 $SHIKANE_OUTPUT_NAME",
  "swaybg -o $SHIKANE_OUTPUT_NAME -i /home/gary/Pictures/left.jpg -m fill &"
]

